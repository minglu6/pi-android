# Build the release APK with the repo's no-Gradle pipeline (app/build.sh).
# Triggers: every push to master, manual workflow_dispatch, and version tags.
name: Build APK

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write  # upload artifacts; create/update GitHub Release on tags

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  # Matches app/build.sh TARGET_SDK / platform jar
  ANDROID_PLATFORM: android-36
  BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  build:
    name: aapt2 → javac → d8 → apksigner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools + platform/build-tools
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
          # sdkmanager expects cmdline-tools/<version>|latest/bin/sdkmanager
          mv /tmp/cmdline-tools-unpack/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}"
          test -f "$ANDROID_HOME/platforms/${ANDROID_PLATFORM}/android.jar"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt2"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/d8"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner"

      - name: Put aapt2 / d8 / apksigner on PATH
        run: |
          echo "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Export ANDROID_JAR
        run: |
          JAR="$ANDROID_HOME/platforms/${ANDROID_PLATFORM}/android.jar"
          echo "ANDROID_JAR=$JAR" >> "$GITHUB_ENV"
          ls -l "$JAR"

      - name: Fetch AAR/JAR dependencies
        working-directory: app
        run: |
          set -euo pipefail
          python3 tools/fetch-aars.py \
            --root androidx.appcompat:appcompat:1.7.0 \
            --root androidx.recyclerview:recyclerview:1.3.2 \
            --root androidx.constraintlayout:constraintlayout:2.2.1 \
            --root com.google.android.material:material:1.12.0 \
            --root org.jetbrains.kotlin:kotlin-stdlib:1.9.24 \
            --root com.squareup.okhttp3:okhttp:4.12.0 \
            --root androidx.swiperefreshlayout:swiperefreshlayout:1.1.0 \
            --exclude org.jetbrains.kotlin:kotlin-stdlib-jdk7 \
            --exclude org.jetbrains.kotlin:kotlin-stdlib-jdk8 \
            --exclude org.jetbrains.kotlin:kotlin-stdlib-common
          python3 tools/axml-package.py --all --libs libs

      - name: Set up Node for isolated bridge tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Isolated RPC / JVM / build-failure regressions
        run: |
          set -euo pipefail
          npm ci --prefix bridge
          bash tests/bridge-connection/setup-json.sh
          bash tests/bridge-connection/run.sh
          bash tests/model-state/run.sh
          bash tests/extension-ui/run.sh
          bash tests/ansi/run.sh
          bash tests/message-queue/run.sh
          bash tests/card-scroll/run.sh
          python3 tests/test_build_failures.py
          node --test bridge/tests/pi-rpc-bridge.test.mjs bridge/tests/suggestions.test.mjs

      - name: Verify toolchain
        run: |
          set -euo pipefail
          command -v aapt2
          command -v d8
          command -v apksigner
          command -v javac
          command -v keytool
          test -f "$ANDROID_JAR"
          aapt2 version || true
          javac -version

      - name: Build APK (app/build.sh --only-apk)
        working-directory: app
        run: bash build.sh --only-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-android
          path: app/out/pi-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/out/pi-android.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
